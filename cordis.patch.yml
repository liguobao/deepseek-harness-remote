# GitHub installs resolve this repository's root package. Keep this patch at
# the root and point it at the root package name so DSH Desktop can recognize
# and load the repository directly as a bundle.
- insert:
    - id: dsh-remote
      name: dsh-remote
      inject: [sessions, agents, approval, settings, apiProxy, connection]
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
