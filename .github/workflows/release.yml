name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'))
          const root = await readJson('package.json')
          const plugin = await readJson('packages/plugin/package.json')
          const versions = new Set([root.version, plugin.version])
          const expectedTag = `v${plugin.version}`

          if (versions.size !== 1) {
            throw new Error(`Release versions do not match: ${[...versions].join(', ')}`)
          }
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: |
          pnpm --filter './packages/**' -r build
          pnpm -r check

      - name: Run tests
        run: pnpm -r test

      - name: Build workspace
        run: NODE_ENV=production pnpm -r build

      - name: Pack npm plugin
        run: |
          mkdir -p release-assets
          pnpm --dir packages/plugin pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release assets
        run: |
          cd release-assets
          sha256sum dsh-remote-plugin-*.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeepSeek 远程连接 ${GITHUB_REF_NAME}" \
            --notes "Plugin-only release. The frozen Android prototype is not included." \
            --generate-notes
